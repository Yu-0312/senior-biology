<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>食物檢測實驗室｜生物實驗室</title>
  <meta name="description" content="挑一種食物樣品，滴入本氏液、碘液、雙縮脲與蘇丹 III，需要時隔水加熱，即時觀察四支試管的顏色變化，判斷醣類、蛋白質與脂質。" />
  <meta name="theme-color" content="#13171c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <link rel="canonical" href="https://yu-0312.github.io/senior-biology/lab.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="食物檢測實驗室｜生物實驗室" />
  <meta property="og:description" content="選樣品、滴試劑、加熱，四支試管直接告訴你食物裡有什麼有機物。" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:url" content="https://yu-0312.github.io/senior-biology/lab.html" />
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("pl-theme"));
        if (saved !== "light" && saved !== "dark") saved = "light";
        document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=20261107-0814" />
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=20261107-0814" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css?v=20261107-0814" />
  <link rel="stylesheet" href="css/lab.css?v=20261107-0814" />
</head>

<body class="lab-page">
  <a class="skip-link" href="#lab-canvas">跳至實驗台</a>
  <header class="lab-top">
    <a class="lab-home" href="./" title="回首頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      <span>生物實驗室</span>
    </a>
    <h1 class="lab-title">食物檢測實驗室</h1>

    <div class="lab-readout-bar" aria-live="polite">
      <span class="lab-chip"><b id="lab-sample">樣品 —</b></span>
      <span class="lab-chip"><b id="lab-detect">檢出 —</b></span>
      <span class="lab-chip"><b id="lab-heat">未加熱</b></span>
    </div>

    <div class="lab-actions">
      <button class="lab-btn icon" id="lab-undo" type="button" title="復原（Ctrl+Z）" aria-label="復原">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="lab-btn icon" id="lab-redo" type="button" title="重做（Ctrl+Shift+Z）" aria-label="重做">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <div class="lab-menu">
        <button class="lab-btn" id="lab-examples-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lab-examples">範例</button>
        <div class="lab-pop" id="lab-examples" role="menu" hidden></div>
      </div>
      <div class="lab-menu">
        <button class="lab-btn" id="lab-file-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lab-file">檔案</button>
        <div class="lab-pop" id="lab-file" role="menu" hidden>
          <button type="button" role="menuitem" data-act="share">複製配方連結</button>
          <button type="button" role="menuitem" data-act="export">下載配方（.json）</button>
          <button type="button" role="menuitem" data-act="import">開啟配方…</button>
          <button type="button" role="menuitem" data-act="png">存成圖片（.png）</button>
          <button type="button" role="menuitem" data-act="clear" class="danger">倒掉重來</button>
        </div>
      </div>
      <button class="lab-btn icon" id="lab-theme" type="button" aria-label="切換深色／淺色" title="切換深色／淺色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="lab-main">
    <aside class="lab-palette" aria-label="樣品與試劑">
      <div class="lab-tabs" id="lab-tabs" role="tablist" aria-label="試劑分類"></div>
      <div class="lab-tiles" id="lab-tiles" role="tabpanel" aria-live="polite"></div>
      <p class="lab-palette-hint">選樣品 → 點試劑滴入對應試管 → 本氏液需要隔水加熱。</p>
    </aside>

    <section class="lab-stage" id="lab-stage">
      <canvas id="lab-canvas" tabindex="0" aria-label="食物檢測實驗台。左側選樣品，右側對四支試管滴試劑與加熱，即時看到顏色結果。" aria-describedby="lab-status"></canvas>
      <div class="lab-empty" id="lab-empty">
        <h2>從樣品架挑第一個食物</h2>
        <p>這裡不是只看動畫：每滴試劑都依「樣品成分 → 顯色反應」的規則真的變色。先拿葡萄糖水加本氏液隔水加熱，看看還原醣的磚紅色怎麼出現。</p>
        <ul>
          <li><b>還原醣</b>：本氏液隔水加熱，藍 → 綠 → 黃 → 橙 → 磚紅。</li>
          <li><b>澱粉</b>：碘液常溫即變藍紫色，不用加熱。</li>
          <li><b>蛋白質／脂質</b>：雙縮脲呈紫紅、蘇丹 III 染橙紅油滴。</li>
        </ul>
        <div class="lab-empty-actions" id="lab-empty-actions"></div>
      </div>
      <p class="lab-status" id="lab-status" aria-live="polite">尚未選擇樣品。</p>
      <div class="lab-toast" id="lab-toast" role="status" aria-live="polite" hidden></div>
    </section>

    <aside class="lab-inspector" id="lab-inspector" aria-label="試劑設定與讀數"></aside>
  </main>

  <input type="file" id="lab-import" accept="application/json,.json" hidden />

  <script src="js/site-config.js?v=20261107-0814"></script>
  <script src="js/lab/lab.js?v=20261107-0814"></script>
</body>
</html>
